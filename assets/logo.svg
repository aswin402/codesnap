<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="bracketGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
  </defs>

  <!-- Container Squircle -->
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="2"/>

  <!-- Screen Capture Viewfinder Corners -->
  <g stroke="url(#bracketGrad)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Top-Left -->
    <path d="M 26 42 L 26 30 A 4 4 0 0 1 30 26 L 42 26" />
    <!-- Top-Right -->
    <path d="M 86 26 L 98 26 A 4 4 0 0 1 102 30 L 102 42" />
    <!-- Bottom-Left -->
    <path d="M 26 86 L 26 98 A 4 4 0 0 0 30 102 L 42 102" />
    <!-- Bottom-Right -->
    <path d="M 86 102 L 98 102 A 4 4 0 0 0 102 98 L 102 86" />
  </g>

  <!-- Center Code Glyph: < / > -->
  <g stroke="#f8fafc" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Left Bracket < -->
    <path d="M 52 50 L 40 64 L 52 78" />
    <!-- Slash / -->
    <path d="M 68 46 L 60 82" stroke="url(#bracketGrad)" />
    <!-- Right Bracket > -->
    <path d="M 76 50 L 88 64 L 76 78" />
  </g>
</svg>
