<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 200" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <linearGradient id="bracketGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <linearGradient id="slashGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>

    <radialGradient id="ambientGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <style>
    <![CDATA[
      @keyframes logoIntro {
        0% {
          transform: scale(0.7) translate(10px, 10px);
          opacity: 0;
        }
        6% {
          transform: scale(1.05) translate(-2px, -2px);
          opacity: 1;
        }
        9%, 86% {
          transform: scale(1) translate(0, 0);
          opacity: 1;
        }
        92%, 100% {
          transform: scale(0.95);
          opacity: 0;
        }
      }

      @keyframes snapCorners {
        0% {
          transform: scale(1.22);
          opacity: 0;
        }
        6% {
          transform: scale(0.96);
          opacity: 1;
        }
        9%, 86% {
          transform: scale(1);
          opacity: 1;
        }
        92%, 100% {
          transform: scale(1.1);
          opacity: 0;
        }
      }

      @keyframes codeGlyph {
        0%, 4% {
          transform: scale(0.6);
          opacity: 0;
        }
        8%, 86% {
          transform: scale(1);
          opacity: 1;
        }
        92%, 100% {
          transform: scale(0.8);
          opacity: 0;
        }
      }

      @keyframes slashPulse {
        0%, 15% {
          stroke-opacity: 0.8;
          stroke-width: 4.5;
        }
        30%, 50% {
          stroke-opacity: 1;
          stroke-width: 5.5;
        }
        70%, 100% {
          stroke-opacity: 0.8;
          stroke-width: 4.5;
        }
      }

      @keyframes slideTitle {
        0%, 8% {
          transform: translateX(-40px);
          opacity: 0;
        }
        16%, 86% {
          transform: translateX(0);
          opacity: 1;
        }
        92%, 100% {
          transform: translateX(20px);
          opacity: 0;
        }
      }

      @keyframes fadeSubtitle {
        0%, 13% {
          transform: translateY(8px);
          opacity: 0;
        }
        20%, 86% {
          transform: translateY(0);
          opacity: 1;
        }
        92%, 100% {
          transform: translateY(-4px);
          opacity: 0;
        }
      }

      @keyframes pulseGlow {
        0%, 100% { opacity: 0.25; transform: scale(0.9); }
        50% { opacity: 0.7; transform: scale(1.1); }
      }

      .logo-container {
        animation: logoIntro 8s cubic-bezier(0.16, 1, 0.3, 1) infinite;
        transform-origin: 124px 100px;
      }

      .corners-group {
        animation: snapCorners 8s cubic-bezier(0.16, 1, 0.3, 1) infinite;
        transform-origin: 124px 100px;
      }

      .code-glyph {
        animation: codeGlyph 8s cubic-bezier(0.16, 1, 0.3, 1) infinite;
        transform-origin: 124px 100px;
      }

      .slash-glow {
        animation: slashPulse 4s ease-in-out infinite;
      }

      .title-text {
        animation: slideTitle 8s cubic-bezier(0.16, 1, 0.3, 1) infinite;
      }

      .subtitle-text {
        animation: fadeSubtitle 8s cubic-bezier(0.16, 1, 0.3, 1) infinite;
      }

      .glow-bg {
        animation: pulseGlow 4s ease-in-out infinite;
        transform-origin: 124px 100px;
      }
    ]]>
  </style>

  <!-- Banner Background -->
  <rect width="840" height="200" rx="16" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Ambient Light Behind Logo -->
  <circle class="glow-bg" cx="124" cy="100" r="85" fill="url(#ambientGlow)"/>

  <!-- Animated Logo Mark -->
  <g class="logo-container">
    <!-- Squircle Backdrop -->
    <rect x="60" y="36" width="128" height="128" rx="28" fill="#0b0f19" stroke="#334155" stroke-width="1.5"/>

    <!-- Viewfinder Corners (Snaps in) -->
    <g class="corners-group" stroke="url(#bracketGrad)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <!-- Top-Left -->
      <path d="M 84 76 L 84 64 A 4 4 0 0 1 88 60 L 100 60" />
      <!-- Top-Right -->
      <path d="M 148 60 L 160 60 A 4 4 0 0 1 164 64 L 164 76" />
      <!-- Bottom-Left -->
      <path d="M 84 124 L 84 136 A 4 4 0 0 0 88 140 L 100 140" />
      <!-- Bottom-Right -->
      <path d="M 148 140 L 160 140 A 4 4 0 0 0 164 136 L 164 124" />
    </g>

    <!-- Center Code Glyph -->
    <g class="code-glyph" stroke="#f8fafc" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <!-- Left Bracket < -->
      <path d="M 112 86 L 100 100 L 112 114" />
      <!-- Slash / with pulse -->
      <path class="slash-glow" d="M 128 82 L 120 118" stroke="url(#slashGrad)" />
      <!-- Right Bracket > -->
      <path d="M 136 86 L 148 100 L 136 114" />
    </g>
  </g>

  <!-- Typography with Slide-out Animation to the Right -->
  <g>
    <!-- Title: codesnap -->
    <text class="title-text" x="220" y="105"
          font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
          font-size="52"
          font-weight="800"
          letter-spacing="-1.5px"
          fill="url(#textGrad)">codesnap</text>

    <!-- Subtitle: Description -->
    <text class="subtitle-text" x="222" y="138"
          font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
          font-size="16"
          font-weight="400"
          letter-spacing="0.2px"
          fill="#94a3b8">Instant offline code extractor for Linux (Wayland &amp; GNOME)</text>
  </g>
</svg>
