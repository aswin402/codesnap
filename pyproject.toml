[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "codesnap"
version = "2.4.3"
description = "Offline code extractor for Ubuntu Wayland (GNOME)"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "codesnap" }]
license = { text = "MIT" }
dependencies = [
    "pillow>=10.0.0",
    "pytesseract>=0.3.10",
    "ruff>=0.4.0",
    "jeepney>=0.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.4.0",
]

[project.scripts]
codesnap = "codesnap.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/codesnap"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = []

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
